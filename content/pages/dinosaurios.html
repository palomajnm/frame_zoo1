<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Hábitat de Dinosaurios - Zoo Virtual</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <script>
        // Generador de Rocas Volcánicas
        AFRAME.registerComponent('volcanic-rocks', {
            schema: {
                count: { type: 'int', default: 80 },
                radius: { type: 'int', default: 200 }
            },
            init: function () {
                // Solo rocas volcánicas, sin vegetación
                for (let i = 0; i < this.data.count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * this.data.radius;
                    const x = Math.cos(angle) * distance;
                    const z = Math.sin(angle) * distance;

                    this.createRock(x, z);
                }
            },

            createRock: function (x, z) {
                const rock = document.createElement('a-entity');
                rock.setAttribute('position', `${x} 0 ${z}`);

                // Roca volcánica (más pequeña)
                const boulder = document.createElement('a-icosahedron');
                const size = 0.3 + Math.random() * 0.9; // Reducido de 0.5-2.5 a 0.3-1.2
                boulder.setAttribute('radius', size);
                boulder.setAttribute('position', `0 ${size / 2} 0`);
                boulder.setAttribute('color', `#${Math.floor(Math.random() * 2) ? '4A4A4A' : '2F2F2F'}`);
                boulder.setAttribute('shadow', 'cast: true; receive: true');
                boulder.setAttribute('rotation', `${Math.random() * 360} ${Math.random() * 360} ${Math.random() * 360}`);

                rock.appendChild(boulder);
                this.el.appendChild(rock);
            }
        });

        // Componente para forzar carga de texturas
        AFRAME.registerComponent('fix-materials', {
            init: function () {
                const el = this.el;
                el.addEventListener('model-loaded', () => {
                    setTimeout(() => {
                        const mesh = el.getObject3D('mesh');
                        if (mesh) {
                            mesh.traverse((node) => {
                                if (node.material) {
                                    node.material.needsUpdate = true;
                                }
                            });
                        }
                    }, 100);
                });
            }
        });

        // Sistema de Partículas de Ceniza Volcánica
        AFRAME.registerComponent('volcanic-ash', {
            schema: {
                count: { type: 'int', default: 150 },
                radius: { type: 'number', default: 50 }
            },
            init: function () {
                for (let i = 0; i < this.data.count; i++) {
                    const ash = document.createElement('a-sphere');

                    // Posición aleatoria en el área
                    const x = (Math.random() - 0.5) * this.data.radius * 2;
                    const y = Math.random() * 20 + 2;
                    const z = (Math.random() - 0.5) * this.data.radius * 2;

                    ash.setAttribute('radius', Math.random() * 0.05 + 0.02);
                    ash.setAttribute('position', `${x} ${y} ${z}`);
                    ash.setAttribute('color', Math.random() > 0.5 ? '#888888' : '#666666');
                    ash.setAttribute('material', 'opacity: 0.6; transparent: true');

                    // Animación de caída lenta y flotante
                    const duration = 15000 + Math.random() * 10000;
                    const delay = Math.random() * 5000;
                    ash.setAttribute('animation', `property: position; to: ${x + (Math.random() - 0.5) * 10} ${y - 25} ${z + (Math.random() - 0.5) * 10}; dur: ${duration}; loop: true; delay: ${delay}; easing: linear`);

                    this.el.appendChild(ash);
                }
            }
        });

        // Detalles Volcánicos del Suelo
        AFRAME.registerComponent('volcanic-details', {
            schema: {
                count: { type: 'int', default: 100 },
                radius: { type: 'number', default: 80 }
            },
            init: function () {
                for (let i = 0; i < this.data.count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * this.data.radius;
                    const x = Math.cos(angle) * distance;
                    const z = Math.sin(angle) * distance;

                    const type = Math.random();

                    if (type < 0.3) {
                        // Cristales de azufre (amarillos)
                        this.createSulfurCrystal(x, z);
                    } else if (type < 0.5) {
                        // Roca de obsidiana (negra brillante)
                        this.createObsidian(x, z);
                    } else if (type < 0.7) {
                        // Grieta con lava
                        this.createLavaCrack(x, z);
                    } else {
                        // Fumarola (vapor)
                        this.createFumarole(x, z);
                    }
                }
            },

            createSulfurCrystal: function (x, z) {
                const crystal = document.createElement('a-entity');
                crystal.setAttribute('position', `${x} 0 ${z}`);

                // Grupo de cristales
                const count = Math.floor(Math.random() * 3) + 2;
                for (let i = 0; i < count; i++) {
                    const shard = document.createElement('a-box');
                    const size = Math.random() * 0.3 + 0.1;
                    shard.setAttribute('width', size * 0.3);
                    shard.setAttribute('height', size);
                    shard.setAttribute('depth', size * 0.3);
                    shard.setAttribute('position', `${(Math.random() - 0.5) * 0.5} ${size / 2} ${(Math.random() - 0.5) * 0.5}`);
                    shard.setAttribute('rotation', `${Math.random() * 30} ${Math.random() * 360} ${Math.random() * 30}`);
                    shard.setAttribute('color', '#FFFF00');
                    shard.setAttribute('material', 'metalness: 0.3; roughness: 0.4; emissive: #FFFF00; emissiveIntensity: 0.2');
                    crystal.appendChild(shard);
                }

                this.el.appendChild(crystal);
            },

            createObsidian: function (x, z) {
                const obsidian = document.createElement('a-dodecahedron');
                const size = Math.random() * 0.6 + 0.3;
                obsidian.setAttribute('radius', size);
                obsidian.setAttribute('position', `${x} ${size * 0.5} ${z}`);
                obsidian.setAttribute('rotation', `${Math.random() * 360} ${Math.random() * 360} ${Math.random() * 360}`);
                obsidian.setAttribute('color', '#0A0A0A');
                obsidian.setAttribute('material', 'metalness: 0.9; roughness: 0.1');
                obsidian.setAttribute('shadow', 'cast: true');

                this.el.appendChild(obsidian);
            },

            createLavaCrack: function (x, z) {
                const crack = document.createElement('a-plane');
                const length = Math.random() * 2 + 1;
                crack.setAttribute('width', 0.2);
                crack.setAttribute('height', length);
                crack.setAttribute('position', `${x} 0.02 ${z}`);
                crack.setAttribute('rotation', '-90 0 ' + (Math.random() * 360));
                crack.setAttribute('color', '#FF4500');
                crack.setAttribute('material', 'emissive: #FF4500; emissiveIntensity: 0.8');
                crack.setAttribute('animation', `property: material.emissiveIntensity; from: 0.6; to: 1; dir: alternate; dur: ${2000 + Math.random() * 1000}; loop: true`);

                this.el.appendChild(crack);
            },

            createFumarole: function (x, z) {
                const fumarole = document.createElement('a-entity');
                fumarole.setAttribute('position', `${x} 0 ${z}`);

                // Base oscura
                const base = document.createElement('a-cone');
                base.setAttribute('radius-bottom', '0.3');
                base.setAttribute('radius-top', '0.1');
                base.setAttribute('height', '0.2');
                base.setAttribute('position', '0 0.1 0');
                base.setAttribute('color', '#2A2A2A');
                fumarole.appendChild(base);

                // Vapor (3 esferas subiendo)
                for (let i = 0; i < 3; i++) {
                    const steam = document.createElement('a-sphere');
                    steam.setAttribute('radius', Math.random() * 0.15 + 0.1);
                    steam.setAttribute('position', `0 ${0.3 + i * 0.5} 0`);
                    steam.setAttribute('color', '#CCCCCC');
                    steam.setAttribute('material', 'opacity: 0.4; transparent: true');
                    steam.setAttribute('animation', `property: position; to: 0 ${3 + i * 0.5} 0; dur: ${3000 + i * 500}; loop: true; easing: easeOutQuad`);
                    steam.setAttribute('animation__fade', `property: material.opacity; to: 0; dur: ${3000 + i * 500}; loop: true; easing: easeInQuad`);
                    steam.setAttribute('animation__scale', `property: scale; to: 1.5 1.5 1.5; dur: ${3000 + i * 500}; loop: true; easing: linear; delay: ${i * 300}`);
                    fumarole.appendChild(steam);
                }

                this.el.appendChild(fumarole);
            }
        });
    </script>
</head>

<body>

        <script>
            // Sistema automático de animaciones para T-Rex
            AFRAME.registerComponent('trex-auto-animations', {
                init: function () {
                    const trex = document.querySelector('#new-trex');
                    trex.addEventListener('model-loaded', () => {
                        const mixer = trex.components['animation-mixer'];
                        if (!mixer || !mixer.mixer) return;

                        const animations = [];
                        mixer.mixer._actions.forEach((action) => {
                            animations.push(action._clip.name);
                        });
                        console.log('🦖 Animaciones T-Rex:', animations);

                        // Configurar ciclo: Principal (0) <-> Especial (2)
                        if (animations.length > 0) {
                            trex.setAttribute('animation-mixer', {
                                clip: animations[0],
                                loop: 'repeat'
                            });

                            const doSpecial = () => {
                                // Elegir aleatoriamente una animación especial si hay más disponibles
                                const specialIndex = animations.length > 2 ? 2 : (animations.length > 1 ? 1 : 0);
                                trex.setAttribute('animation-mixer', {
                                    clip: animations[specialIndex],
                                    loop: 'once'
                                });
                                setTimeout(() => {
                                    trex.setAttribute('animation-mixer', {
                                        clip: animations[0],
                                        loop: 'repeat'
                                    });
                                    setTimeout(doSpecial, 15000 + Math.random() * 10000);
                                }, 5000);
                            };
                            setTimeout(doSpecial, 10000);
                        }
                    });
                }
            });
        </script>
