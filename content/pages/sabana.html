<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Zoo VR Básico con A-Frame - La Sabana Africana</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            /* Se mantiene el fondo de la página, pero la escena VR usará <a-sky> */
            background-image: url(../assets/images/cielo_sabana.jpg);
            font-family: Arial, sans-serif;
        }

        a-scene {
            position: absolute;
            inset: 0;
        }

        a-scene canvas {
            background: transparent;
        }

        #enter-vr-button {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #00796b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        #instructions {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            /* Aumento de padding */
            border-radius: 8px;
            /* Borde más redondeado */
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            letter-spacing: 2px;
            border: 2px solid #FFC107;
            /* Color de borde amarillo/sabana */
        }
    </style>

</head>

<body>
    <div id="instructions">
        LA SABANA AFRICANA
    </div>

    <a-scene shadow="type: basic"> <a-assets>
            <img id="cieloSabanaImg" src="../assets/images/cielo_sabana.jpg" alt="Imagen 360 del cielo de la Sabana">
            <img id="mundoAnimalImg" src="../assets/images/mundoanimal.jpg" alt="Imagen del mundo animal">
        </a-assets>

        <a-sky src="#cieloSabanaImg"></a-sky>

        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#C2B280" shadow
            material="shader: standard; repeat: 50 50;"></a-plane>

        <a-entity light="type: directional; color: #FFF8E1; intensity: 1.5; castShadow: true"
            position="10 20 -10"></a-entity>
        <a-entity light="type: ambient; color: #AAA; intensity: 0.8"></a-entity>

        <a-gltf-model src="../assets/models/arbol_magico/scene.gltf" position="0 0 -10" rotation="0 0 0"
            scale="15 15 15" shadow>
        </a-gltf-model>

        <a-plane id="link-juego" position="0 1.2 -7.5" rotation="0 0 0" width="2" height="0.8" color="darkgreen" shadow
            class="clickable" link="href: ./juego-leones.html; title: Iniciar Juego; visualAspectEnabled: true">
            <a-text value="JUEGO" align="center" position="0 0.01 0" width="6" color="#FFFFFF" font="mozillavr"
                font-weight="bold"></a-text>
        </a-plane>

        <a-gltf-model src="../assets/models/lionsenior/scene.gltf" position="-10 0 -5" rotation="0 10 0"
            scale="0.1 0.1 0.1" shadow>
        </a-gltf-model>

        <a-gltf-model src="../assets/models/elefante_asiatico/scene.gltf" position="12 0 -10" rotation="0 10 0"
            scale="1 1 1" shadow>
        </a-gltf-model>

        <a-gltf-model src="../assets/models/new_qlone/scene.gltf" position="8 2 -10" rotation="0 10 0"
            scale="0.03 0.03 0.03" shadow>
        </a-gltf-model>

        <a-gltf-model src="../assets/models/baby_lion/scene.gltf" position="-10 0 -5" rotation="0 45 0" scale="1 1 1"
            shadow>
        </a-gltf-model>

        <a-cylinder position="-10 0.001 -5" radius="4" height="0.05" color="#558B2F" rotation="0 0 0" shadow>
        </a-cylinder>

        <a-cylinder position="10 0.001 -11" radius="6" height="0.05" color="#558B2F" rotation="0 0 0" shadow>
        </a-cylinder>

        <a-text value="LEONES (Panthera leo)\nDieta: Carnivora\nHabitat: Sabana y pastizales" align="center"
            position="-10 5 -5" width="5" color="#000000" background-color="#FFFFFF" font="mozillavr">
        </a-text>
        <a-text value="ELEFANTES ASIÁTICOS\nEl mamifero terrestre mas grande de Asia.\nDieta: Herbivora" align="center"
            position="10 5 -10" width="5" color="#000000" background-color="#FFFFFF" font="mozillavr">
        </a-text>

        <a-entity id="rig" movement-controls="speed: 0.5; controls: checkpoint, gamepad, trackpad, keyboard, touch">
            <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
                <a-entity cursor="fuse: false; rayOrigin: mouse;" position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                    material="color: #00FF00; opacity: 0.8; side: double">
                </a-entity>
            </a-entity>

            <a-entity id="leftHand" laser-controls="hand: left"
                raycaster="objects: .clickable, .option-button; far: 5"></a-entity>
            <a-entity id="rightHand" laser-controls="hand: right"
                raycaster="objects: .clickable, .option-button; far: 5"></a-entity>
        </a-entity>

        <script>
            // VR click handler para el botón del juego
            document.querySelector('a-scene').addEventListener('loaded', function () {
                const linkJuego = document.querySelector('#link-juego');
                if (linkJuego) {
                    linkJuego.addEventListener('mousedown', () => window.location.href = './juego-leones.html');
                }
            });
        </script>

    </a-scene>
</body>

</html>
