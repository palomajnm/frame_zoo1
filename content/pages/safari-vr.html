<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean VR - Fotografía Marina</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
        }

        #youtubeContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Botones de navegación flotantes */
        .nav-buttons {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 2000;
        }

        .nav-btn {
            padding: 15px 30px;
            background: rgba(0, 136, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 50px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 136, 255, 0.3);
        }

        .nav-btn:hover {
            background: rgba(0, 136, 255, 0.4);
            border-color: rgba(0, 255, 255, 0.8);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 136, 255, 0.5);
        }

        .nav-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <!-- Botones de navegación -->
    <div class="nav-buttons">
        <a href="../../index.html" class="nav-btn">
            🏠 Volver al Zoo
        </a>
        <a href="oceano.html" class="nav-btn">
            🌊 Mundo Océano
        </a>
    </div>

    <div id="youtubeContainer">
        <!-- YouTube 360° Video Embed -->
        <iframe
            src="https://www.youtube.com/embed/rG4jSz_2HDY?autoplay=1&loop=1&playlist=rG4jSz_2HDY&controls=1&modestbranding=1&rel=0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; xr-spatial-tracking"
            allowfullscreen allowvr="yes" allow-same-origin></iframe>
    </div>

    <script>
        console.log('✅ Video 360° de YouTube cargado');
        console.log('🦈 Great Hammerhead Shark Encounter - National Geographic');
        console.log('🎮 El video mantiene su formato 360° original');
    </script>
</body>

</html>
