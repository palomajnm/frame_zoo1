<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Juego VR: Rescate del Bebé León con Riesgo</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <script>
        // Componente de seguimiento del juego
        AFRAME.registerComponent('rescue-game-manager', {
            init: function() {
                this.requiredRescueItems = 3; // Cuántos objetos buenos hay que recoger
                this.collectedRescueItems = 0;
                this.dangerLevel = 0; // Nuevo contador de peligro
                this.maxDangerLevel = 3; // Nivel máximo de peligro antes de perder
                
                this.messageEl = document.getElementById('mensaje-juego');
                this.dangerEl = document.getElementById('danger-level'); // Nuevo elemento de UI para el peligro
                this.babyLionEl = document.getElementById('baby-lion-model');

                // Inicializar mensajes
                this.updateUI();

                // Escuchar eventos
                this.el.sceneEl.addEventListener('itemCollected', this.itemCollectedHandler.bind(this));
                this.el.sceneEl.addEventListener('dangerCollected', this.dangerCollectedHandler.bind(this));
            },

            updateUI: function() {
                // Actualizar el objetivo de rescate
                this.messageEl.setAttribute('text', {
                    value: `OBJETIVO: Recoge items de curación. (${this.collectedRescueItems}/${this.requiredRescueItems})`,
                    color: 'white'
                });

                // Actualizar el nivel de peligro
                this.dangerEl.setAttribute('text', {
                    value: `PELIGRO: ${this.dangerLevel}/${this.maxDangerLevel}`,
                    color: this.dangerLevel >= this.maxDangerLevel - 1 ? 'red' : 'yellow' // Cambia a rojo cuando está cerca de perder
                });
            },

            itemCollectedHandler: function() {
                if (this.collectedRescueItems >= this.requiredRescueItems) return; // Ya ganó

                this.collectedRescueItems++;
                this.updateUI();

                // Comprobar la condición de victoria
                if (this.collectedRescueItems >= this.requiredRescueItems) {
                    this.messageEl.setAttribute('text', {
                        value: "¡RESCATE EXITOSO! El bebé león está a salvo. ¡Ganaste!",
                        color: 'gold',
                        wrapCount: 20
                    });
                    this.dangerEl.setAttribute('visible', false);
                    this.babyLionEl.setAttribute('scale', '1.5 1.5 1.5');
                }
            },

            dangerCollectedHandler: function() {
                if (this.collectedRescueItems >= this.requiredRescueItems) return; // Ya ganó
                
                this.dangerLevel++;
                this.updateUI();

                // Comprobar la condición de derrota
                if (this.dangerLevel >= this.maxDangerLevel) {
                    this.messageEl.setAttribute('text', {
                        value: "¡FALLASTE EL RESCATE! El peligro fue demasiado. Presiona ESC para reiniciar.",
                        color: 'red',
                        wrapCount: 20
                    });
                    this.dangerEl.setAttribute('visible', false);
                    // Efecto de derrota (mover el león)
                    this.babyLionEl.setAttribute('position', '-10 0 -3');
                    this.el.sceneEl.pause(); // Pausa el juego para indicar el fin
                }
            }
        });

        // Componente para los objetos de Curación (RESCATE)
        AFRAME.registerComponent('rescue-item', {
            init: function() {
                var el = this.el;
                var sceneEl = el.sceneEl;
                el.classList.add('clickable');

                el.addEventListener('click', function() {
                    if (sceneEl.components['rescue-game-manager'].collectedRescueItems < sceneEl.components['rescue-game-manager'].requiredRescueItems && 
                        sceneEl.components['rescue-game-manager'].dangerLevel < sceneEl.components['rescue-game-manager'].maxDangerLevel) {
                        
                        el.setAttribute('visible', false);
                        sceneEl.emit('itemCollected');

                        var feedbackEl = document.getElementById('feedback-temp');
                        feedbackEl.setAttribute('visible', true);
                        feedbackEl.setAttribute('text', { value: "+1 Curación", color: 'lime' });
                        setTimeout(() => { feedbackEl.setAttribute('visible', false); }, 1000);
                    }
                });
                // Efecto Hover
                el.addEventListener('raycaster-intersected', function () { el.getAttribute('geometry') ? el.setAttribute('scale', '1.2 1.2 1.2') : el.setAttribute('scale', '0.6 0.6 0.6'); });
                el.addEventListener('raycaster-intersected-cleared', function () { el.getAttribute('geometry') ? el.setAttribute('scale', '1 1 1') : el.setAttribute('scale', '0.5 0.5 0.5'); });
            }
        });

        // NUEVO: Componente para los objetos de Peligro (DAÑO)
        AFRAME.registerComponent('danger-item', {
            init: function() {
                var el = this.el;
                var sceneEl = el.sceneEl;
                el.classList.add('clickable');

                el.addEventListener('click', function() {
                    if (sceneEl.components['rescue-game-manager'].collectedRescueItems < sceneEl.components['rescue-game-manager'].requiredRescueItems && 
                        sceneEl.components['rescue-game-manager'].dangerLevel < sceneEl.components['rescue-game-manager'].maxDangerLevel) {
                        
                        el.setAttribute('visible', false);
                        sceneEl.emit('dangerCollected');

                        var feedbackEl = document.getElementById('feedback-temp');
                        feedbackEl.setAttribute('visible', true);
                        feedbackEl.setAttribute('text', { value: "¡PELIGRO! +1 Daño", color: 'red' });
                        setTimeout(() => { feedbackEl.setAttribute('visible', false); }, 1000);
                    }
                });
                // Efecto Hover
                el.addEventListener('raycaster-intersected', function () { el.setAttribute('scale', '1.2 1.2 1.2'); });
                el.addEventListener('raycaster-intersected-cleared', function () { el.setAttribute('scale', '1 1 1'); });
            }
        });
    </script>
    
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        a-scene { position: absolute; inset: 0; }
        a-scene canvas { background: transparent; }
    </style>

</head>

<body>
    <a-scene shadow="type: basic" rescue-game-manager> 
        <a-assets>
            <img id="cieloSabanaImg" src="../assets/images/cielo_sabana.jpg" alt="Imagen 360 del cielo de la Sabana">
            <img id="mundoAnimalImg" src="../assets/images/mundoanimal.jpg" alt="Imagen del mundo animal">

            <a-asset-item id="arbolModel" src="../assets/models/arbol_magico/scene.gltf"></a-asset-item>
            <a-asset-item id="lionSeniorModel" src="../assets/models/lionsenior/scene.gltf"></a-asset-item>
            <a-asset-item id="elephantModel" src="../assets/models/elefante_asiatico/scene.gltf"></a-asset-item>
            <a-asset-item id="babyLionModel" src="../assets/models/baby_lion/scene.gltf"></a-asset-item>
            <a-asset-item id="qloneModel" src="../assets/models/new_qlone/scene.gltf"></a-asset-item>
            <a-asset-item id="botiquinModel" src="../assets/models/botiquin.gltf"></a-asset-item>

        </a-assets>

        <a-sky src="#cieloSabanaImg"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#C2B280" shadow
                 material="shader: standard; repeat: 50 50;"></a-plane>
        <a-entity light="type: directional; color: #FFF8E1; intensity: 1.5; castShadow: true" position="10 20 -10"></a-entity>
        <a-entity light="type: ambient; color: #AAA; intensity: 0.8"></a-entity>

        <a-gltf-model src="#arbolModel" position="0 0 -10" rotation="0 0 0" scale="15 15 15" shadow></a-gltf-model>

        <a-gltf-model src="#lionSeniorModel" position="-10 0 -5" rotation="0 10 0" scale="0.1 0.1 0.1" shadow></a-gltf-model>
        <a-gltf-model id="baby-lion-model" src="#babyLionModel" position="-10 0 -5" rotation="0 45 0" scale="1 1 1" shadow></a-gltf-model>
        <a-gltf-model src="#elephantModel" position="12 0 -10" rotation="0 10 0" scale="1 1 1" shadow></a-gltf-model>
        <a-gltf-model src="#qloneModel" position="8 2 -10" rotation="0 10 0" scale="0.03 0.03 0.03" shadow></a-gltf-model>

        <a-gltf-model src="#botiquinModel" position="3 0 -1" rotation="0 45 0" scale="0.5 0.5 0.5" 
                      rescue-item shadow>
        </a-gltf-model>
        
        <a-cylinder position="-15 0.2 0" radius="0.2" height="0.4" color="#2196F3" rescue-item></a-cylinder>
        
        <a-sphere position="10 0.2 -5" radius="0.3" color="#795548" rescue-item></a-sphere>


        <a-cone position="-12 0.1 -10" radius="0.3" height="0.5" color="#5D4037" 
                rotation="-90 0 0" danger-item>
        </a-cone>

        <a-box position="5 0.1 8" width="0.8" height="0.2" depth="0.8" color="#424242" 
               danger-item>
        </a-box>

        <a-torus position="-5 0.5 15" radius="0.4" radius-tubular="0.1" color="#F44336" 
                 danger-item></a-torus>


        <a-cylinder position="-10 0.001 -5" radius="4" height="0.05" color="#558B2F" rotation="0 0 0" shadow></a-cylinder>
        <a-cylinder position="10 0.001 -11" radius="6" height="0.05" color="#558B2F" rotation="0 0 0" shadow></a-cylinder>

        <a-entity id="hud" position="0 1.6 -2" rotation="0 0 0">
            <a-text id="mensaje-juego" value="Iniciando Rescate..." 
                    align="center" width="3" color="white" 
                    background-color="rgba(0,0,0,0.5)" position="0 0 0" font="mozillavr">
            </a-text>
            <a-text id="danger-level" value="PELIGRO: 0/3" 
                    align="center" width="3" color="yellow" 
                    background-color="rgba(0,0,0,0.5)" position="0 -0.4 0" font="mozillavr">
            </a-text>
            <a-text id="feedback-temp" value="" 
                    align="center" width="2" color="lime" 
                    position="0 -0.8 0" visible="false" font="mozillavr">
            </a-text>
        </a-entity>

        <a-entity id="rig" movement-controls="speed: 0.5; controls: checkpoint, gamepad, trackpad, keyboard, touch">
            <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
                <a-entity cursor="fuse: true; rayOrigin: mouse;" position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                    material="color: #FF0000; opacity: 0.8; side: double">
                </a-entity>
            </a-entity>

            <a-entity id="leftHand" laser-controls="hand: left"
                raycaster="objects: .clickable; far: 15"></a-entity>
            <a-entity id="rightHand" laser-controls="hand: right"
                raycaster="objects: .clickable; far: 15"></a-entity>
        </a-entity>
    </a-scene>
</body>

</html>
