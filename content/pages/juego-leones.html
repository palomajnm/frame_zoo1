<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Juego VR - Safari de Precisión</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    /* Estilos básicos */
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }

    a-scene {
      position: absolute;
      inset: 0;
    }

    /* Estilos para el botón de regreso */
    #back-button {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 10px 20px;
      font-size: 1.2em;
      background-color: #f44336;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: none;
      /* Inicialmente oculto */
    }
  </style>

  <script>
    AFRAME.registerComponent('target-animal', {
      schema: {
        points: { type: 'int', default: 1 } // Puntos por escanear este objetivo
      },
      init: function () {
        var el = this.el;
        el.setAttribute('class', 'clickable');
        this.gameLogic = document.querySelector('[game-logic]').components['game-logic'];


        // Ocultar al iniciar y esperar a que el game-logic lo muestre
        el.setAttribute('visible', 'false');

        // Usar un bounding box invisible para el raycasting preciso
        var boundingBox = document.createElement('a-box');
        boundingBox.setAttribute('width', '1');
        boundingBox.setAttribute('height', '1');
        boundingBox.setAttribute('depth', '1');
        boundingBox.setAttribute('material', 'visible: false');
        el.appendChild(boundingBox);

        // Evento de "Disparo" (Fusión del Cursor o Click)
        boundingBox.addEventListener('click', this.hitHandler.bind(this));
      },

      hitHandler: function () {
        if (!this.el.getAttribute('visible') || this.gameLogic.gameOver) {
          return;
        }

        // 1. Notificar al Game Logic
        this.gameLogic.animalHit(this.data.points);

        // 2. Ocultar inmediatamente
        this.el.setAttribute('visible', 'false');

        // 3. Efecto de Escaneo/Partículas
        var particleEntity = document.createElement('a-entity');
        particleEntity.setAttribute('particle-system', {
          preset: 'explosion',
          color: '#00FF00,#00AA00', // Color verde para éxito
          duration: 500,
          maxAge: 0.5,
          size: 0.2
        });
        particleEntity.setAttribute('position', this.el.getAttribute('position'));
        this.el.sceneEl.appendChild(particleEntity);

        // 4. Reposicionar y Mostrar de nuevo (Spawn) después de un pequeño retraso
        setTimeout(() => {
          this.gameLogic.spawnTarget(this.el);
        }, 1000);
      }
    });
  </script>

  <script>
    AFRAME.registerComponent('game-logic', {
      schema: {
        initialTime: { type: 'int', default: 60 }, // 60 segundos
        targetsToWin: { type: 'int', default: 5 }, // 5 animales escaneados para ganar
        spawnRadius: { type: 'number', default: 15 } // Distancia máxima de aparición
      },
      init: function () {
        this.targetsHit = 0;
        this.timeLeft = this.data.initialTime;
        this.gameOver = false;
        this.targetEntities = document.querySelectorAll('[target-animal]');
        var sceneEl = this.el;

        // Crear HUD (Heads-Up Display)
        this.hudText = document.createElement('a-text');
        this.hudText.setAttribute('value', 'Tiempo: ' + this.timeLeft + 's | Escaneados: 0 / ' + this.data.targetsToWin);
        this.hudText.setAttribute('position', '0 3.5 -5');
        this.hudText.setAttribute('align', 'center');
        this.hudText.setAttribute('width', '5');
        this.hudText.setAttribute('color', 'white');
        this.hudText.setAttribute('font', 'mozillavr');
        sceneEl.appendChild(this.hudText);

        // Iniciar el temporizador
        this.timerInterval = setInterval(this.updateTimer.bind(this), 1000);

        // Iniciar Spawning de todos los objetivos
        this.targetEntities.forEach(target => {
          this.spawnTarget(target);
        });
      },

      // Función para reposicionar y mostrar el objetivo
      // ... (cerca de la línea 120-135) ...

      // Función para reposicionar y mostrar el objetivo
      spawnTarget: function (targetEl) {
        if (this.gameOver) return;

        // Generar coordenadas aleatorias (X y Z)
        var randomAngle = Math.random() * 2 * Math.PI;
        var randomDistance = Math.random() * this.data.spawnRadius;

        var x = Math.cos(randomAngle) * randomDistance;
        var z = Math.sin(randomAngle) * randomDistance;

        // ✨ SOLUCIÓN: Acceder a la posición inicial directamente del atributo del elemento.
        // Usamos 'position' ya que es donde se define la altura Y en el HTML.
        var initialPos = targetEl.getAttribute('position');
        var y = initialPos ? initialPos.y : 0; // Usar 0 como fallback si falla

        targetEl.setAttribute('position', { x: x, y: y, z: z });
        targetEl.setAttribute('visible', 'true');
      },
      // ...

      updateTimer: function () {
        if (this.gameOver) return;

        this.timeLeft--;
        this.updateHud();

        if (this.timeLeft <= 0) {
          this.gameOver = true;
          this.hudText.setAttribute('value', '¡TIEMPO AGOTADO! Has escaneado ' + this.targetsHit + ' de ' + this.data.targetsToWin + '.');
          this.hudText.setAttribute('color', 'red');
          document.getElementById('back-button').style.display = 'block';
          clearInterval(this.timerInterval);
        }
      },

      animalHit: function (points) {
        this.targetsHit += points;
        this.updateHud();

        if (this.targetsHit >= this.data.targetsToWin) {
          this.gameOver = true;
          this.hudText.setAttribute('value', '¡VICTORIA! Todos los animales escaneados. Tiempo restante: ' + this.timeLeft + 's');
          this.hudText.setAttribute('color', 'lime');
          document.getElementById('back-button').style.display = 'block';
          // Ocultar todos los objetivos restantes al ganar
          this.targetEntities.forEach(target => target.setAttribute('visible', 'false'));
          clearInterval(this.timerInterval);
        }
      },

      updateHud: function () {
        this.hudText.setAttribute('value', 'Tiempo: ' + this.timeLeft + 's | Escaneados: ' + this.targetsHit + ' / ' + this.data.targetsToWin);
      },

      remove: function () {
        clearInterval(this.timerInterval);
      }
    });
  </script>
  <script
    src="https://unpkg.com/aframe-particle-system-component@1.1.0/dist/aframe-particle-system-component.min.js"></script>
</head>

<body>
  <div id="instructions" style="
        position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;
        color: white; background-color: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        font-family: Arial, sans-serif; text-align: center;">
    ¡Safari de Precisión! **Mira o haz clic** en los animales cuando aparezcan. ¡Escanea **5** antes de que acabe el
    tiempo!
  </div>

  <a-scene renderer="alpha: true" game-logic="initialTime: 60; targetsToWin: 5">

    <a-entity camera look-controls wasd-controls position="0 1.6 0" raycaster="objects: .clickable"
      cursor="rayOrigin: mouse; fuse: true; fuseTimeout: 1000">
      <a-entity cursor position="0 0 -1" geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
        material="color: green; shader: flat">
      </a-entity>
    </a-entity>

    <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#4CAF50" shadow></a-plane>
    <a-sky color="#87CEEB"></a-sky>
    <a-entity light="type: ambient; color: #BBB; intensity: 0.5"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.8; castShadow: true" position="-5 10 5"></a-entity>

    <a-entity target-animal position="-3 0.5 -5" rotation="0 10 0" scale="0.1 0.1 0.1">
      <a-gltf-model src="../assets/models/lionsenior/scene.gltf"></a-gltf-model>
    </a-entity>

    <a-entity target-animal position="5 0 -8" rotation="0 -45 0" scale="1 1 1">
      <a-gltf-model src="../assets/models/elefante_asiatico/scene.gltf"></a-gltf-model>
    </a-entity>

    <a-entity target-animal position="1 0.5 -2" rotation="0 180 0" scale="1 1 1">
      <a-gltf-model src="../assets/models/baby_lion/scene.gltf"></a-gltf-model>
    </a-entity>

    <a-gltf-model src="../assets/models/arbol_magico/scene.gltf" position="0 0 -10" rotation="0 0 0" scale="15 15 15"
      shadow>
    </a-gltf-model>

  </a-scene>

  <button id="back-button" onclick="window.location.href='../../index.html'">
    Volver al Zoo
  </button>
</body>

</html>
