<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zoo VR Básico con A-Frame</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; /* Elimina márgenes y barras de desplazamiento */
             /* Gradiente de fondo: cambia los colores aquí si quieres */
             background-image:url(./hermoso-diseno-de-cielo-rojo-y-rosa.jpg);
             font-family: Arial, sans-serif;
      }
      a-scene { position: absolute; inset: 0; }
      a-scene canvas { background: transparent; }

      #enter-vr-button {
          position: fixed;
          bottom: 20px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 1000;
          padding: 10px 20px;
          font-size: 1.2em;
          background-color: #00796b;
          color: white;
          border: none;
          border-radius: 5px;
          cursor: pointer;
          font-family: Arial, sans-serif;
      }
      #instructions {
          position: fixed;
          top: 10px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 1000;
          color: white;
          background-color: rgba(0,0,0,0.5);
          padding: 10px;
          border-radius: 5px;
          font-family: Arial, sans-serif;
          text-align: center;
      }
    </style>

  </head>
  <body>
    <div id="instructions">
      ¡Bienvenido al Zoo VR! Mira alrededor.
      <br>
      (En dispositivos compatibles con VR, verás un botón "Enter VR" en la esquina inferior derecha)
    </div>

    <a-scene renderer="alpha: true"> 
<a-entity camera look-controls wasd-controls position="0 1.6 0" 
          raycaster="objects: [link]; far: 50"
          cursor="rayOrigin: mouse; fuse: false">
    <a-entity cursor="rayOrigin: mouse"
              position="0 0 -1"
              geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
              material="color: white; shader: flat">
    </a-entity>
</a-entity>
<!--Este es el suelo-->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="100" height="100" color="#C7B0A7" shadow></a-plane>
<!--Cielo de fondo-->      
      <a-sky src="./hermoso-diseno-de-cielo-rojo-y-rosa.jpg"></a-sky>
      <!--el arbol-->
      <a-gltf-model 
        src="./arbol_magico/scene.gltf"             
        position="0 0 -10"          
        rotation="0 0 0"           
        scale="15 15 15"                 
        shadow>
      </a-gltf-model>

    <a-plane 
    id="link-juego"
    position="0 1.2 -7.5"
    rotation="0 0 0"
    width="2" 
    height="0.8" 
    color="darkgreen"
    shadow
    link="href: ./juego-leones.html; title: Iniciar Juego; visualAspectEnabled: true">

    <a-text 
        value="JUEGO" 
        align="center" 
        position="0 0.01 0" 
        width="6" 
        color="#FFFFFF"
        font="mozillavr"
        font-weight="bold"
    ></a-text>
</a-plane>
    <!--leon grande-->
      <a-gltf-model 
          src="./lionsenior/scene.gltf"             
          position="-10 0 -5"          
          rotation="0 10 0"           
          scale="0.1 0.1 0.1"          
          shadow>
      </a-gltf-model>
      <!--rinoceronte-->
      <a-gltf-model 
          src="./elefante_asiatico/scene.gltf"       
          position="12 0 -10"               
          rotation="0 10 0"              
          scale="1 1 1"             
          shadow>
      </a-gltf-model>
      <a-gltf-model 
          src="./new_qlone/scene.gltf"        
          position="8 2 -10"               
          rotation="0 10 0"              
          scale="0.03 0.03 0.03"             
          shadow>
      </a-gltf-model>
      <!--leon bebe-->
      <a-gltf-model 
          src="./baby_lion/scene.gltf"             
          position="-10 0 -5"          
          rotation="0 45 0"           
          scale="1 1 1"               
          shadow>
      </a-gltf-model>
<!--Cilindros de césped-->
      <a-cylinder 
          position="-10 0 -5"      
          radius="4"             
          height="0.05"           
          color="#558B2F"      
          rotation="0 0 0"       
          shadow>
      </a-cylinder>

      <a-cylinder 
          position="10 0 -11"      
          radius="6"             
          height="0.05"           
          color="#558B2F"      
          rotation="0 0 0"       
          shadow>
      </a-cylinder>

      <a-text 
          value="LEONES (Panthera leo)\nDieta: Carnivora\nHabitat: Sabana y pastizales" 
          align="center" 
          position="-10 5 -5" 
          width="5" 
          color="#000000"
          background-color="#FFFFFF"
          font="mozillavr">
      </a-text>
      <a-text 
          value="ELEFANTES ASIÁTICOS\nEl mamifero terrestre mas grande de Asia.\nDieta: Herbivora" 
          align="center" 
          position="10 5 -10" 
          width="5" 
          color="#000000"
          background-color="#FFFFFF"
          font="mozillavr">
      </a-text>

      <a-entity light="type: ambient; color: #BBB; intensity: 0.5"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 0.8; castShadow: true" position="-5 10 5"></a-entity>

    </a-scene>
  </body>
</html>
