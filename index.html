<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Zoo Virtual - Recepción</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        @font-face {
            font-family: 'WildTrails';
            src: url('./content/assets/fonts/WildTrails.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'WildTrails', sans-serif;
        }
    </style>
</head>

<body>
    <a-scene>

        <a-assets>
            <img id="mundoAnimalImg" src="./content/assets/images/mundoAnimal.jpg" alt="Imagen del mundo animal">
        </a-assets>

        <a-sky color="#D4E6F1"></a-sky>

        <a-plane position="0 0 -4" rotation="-90 0 0" width="12" height="10" color="#8B6F47"
            material="roughness: 0.8; metalness: 0.1" shadow="receive: true">
        </a-plane>

        <a-plane position="0 2.5 -9" rotation="0 0 0" width="12" height="5" color="#E8DCC8" material="roughness: 0.9"
            shadow="receive: true">
        </a-plane>

        <a-plane position="-6 2.5 -4" rotation="0 90 0" width="10" height="5" color="#E8DCC8" material="roughness: 0.9"
            shadow="receive: true">
        </a-plane>

        <a-plane position="6 2.5 -4" rotation="0 -90 0" width="10" height="5" color="#E8DCC8" material="roughness: 0.9"
            shadow="receive: true">
        </a-plane>

        <a-plane id="mapa-pared" position="0 2.5 -8.81" width="10" height="5" src="#mundoAnimalImg" shadow="cast: true">
        </a-plane>

        <a-box position="0 2.5 -8.84" width="10.2" height="5.2" depth="0.05" color="#654321"
            material="roughness: 0.3; metalness: 0.2">
        </a-box>

        <a-text value="BIENVENIDOS AL ZOO VIRTUAL" align="center" font="mozillavr" color="#2C1810" width="7"
            position="0 4.8 -8.8" shadow="cast: true">
        </a-text>

        <a-entity position="0 2.5 -8.7">
            <a-cone id="pin-sabana" radius-bottom="0.15" radius-top="0.02" height="0.2" color="#FF4500"
                class="clickable"
                link="href: ./content/pages/sabana.html"
                animation__hover="property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 200"
                animation__hoverout="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"
                animation="property: scale; dir: alternate; dur: 1000; to: 1.1 1.1 1.1; loop: true" shadow="cast: true">
            </a-cone>

            <a-sphere radius="0.12" position="0 0.2 0" color="#FF6B35"
                animation="property: position; to: 0 0.25 0; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine"
                shadow="cast: true">
            </a-sphere>

            <a-text value="LA SABANA" align="center" width="3" color="#2C1810" position="0 -0.5 0.1">
            </a-text>
        </a-entity>

        <a-entity position="1.7 1.8 -8.7">
            <a-cone id="pin-oceano" radius-bottom="0.15" radius-top="0.02" height="0.2" color="#006994"
                class="clickable"
                link="href: ./content/pages/oceano.html"
                animation__hover="property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 200"
                animation__hoverout="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"
                animation="property: scale; dir: alternate; dur: 1000; to: 1.1 1.1 1.1; loop: true" shadow="cast: true">
            </a-cone>

            <a-sphere radius="0.12" position="0 0.2 0" color="#4A90E2"
                animation="property: position; to: 0 0.25 0; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine"
                shadow="cast: true">
            </a-sphere>

            <a-text value="EL OCEANO" align="center" width="3" color="#2C1810" position="0 -0.5 0.1">
            </a-text>
        </a-entity>

        <a-entity position="-1.5 3.5 -8.7">
            <a-cone id="pin-dinosaurios" radius-bottom="0.15" radius-top="0.02" height="0.2" color="#228B22"
                class="clickable"
                link="href: ./content/pages/dinosaurios.html"
                animation__hover="property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 200"
                animation__hoverout="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"
                animation="property: scale; dir: alternate; dur: 1000; to: 1.1 1.1 1.1; loop: true" shadow="cast: true">
            </a-cone>

            <a-sphere radius="0.12" position="0 0.2 0" color="#32CD32"
                animation="property: position; to: 0 0.25 0; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine"
                shadow="cast: true">
            </a-sphere>

            <a-text value="DINOSAURIOS" align="center" width="3" color="#2C1810" position="0 -0.5 0.1">
            </a-text>
        </a-entity>


        <a-box position="0 0.5 -2" width="3" height="1" depth="1" color="#654321"
            material="roughness: 0.5; metalness: 0.1" shadow="cast: true; receive: true">
        </a-box>

        <a-entity position="-4 0 -1">
            <a-box position="0 0.3 0" width="0.6" height="0.1" depth="0.6" color="#8B4513" shadow="cast: true">
            </a-box>
            <a-box position="0 0.6 -0.25" width="0.6" height="0.6" depth="0.1" color="#8B4513" shadow="cast: true">
            </a-box>
            <a-cylinder radius="0.03" height="0.3" position="-0.2 0.15 -0.2" color="#654321" shadow="cast: true">
            </a-cylinder>
            <a-cylinder radius="0.03" height="0.3" position="0.2 0.15 -0.2" color="#654321" shadow="cast: true">
            </a-cylinder>
            <a-cylinder radius="0.03" height="0.3" position="-0.2 0.15 0.2" color="#654321" shadow="cast: true">
            </a-cylinder>
            <a-cylinder radius="0.03" height="0.3" position="0.2 0.15 0.2" color="#654321" shadow="cast: true">
            </a-cylinder>
        </a-entity>

        <a-entity id="avion" position="0 0.85 -2">
            <a-gltf-model src="./content/assets/models/avion/plane.glb" scale="0.4 0.4 0.4" rotation="0 35 0" shadow
                animation-mixer>
            </a-gltf-model>
        </a-entity>
        <a-entity position="4 0 -1">
            <a-box position="0 0.3 0" width="0.6" height="0.1" depth="0.6" color="#8B4513" shadow="cast: true">
            </a-box>
            <a-box position="0 0.6 -0.25" width="0.6" height="0.6" depth="0.1" color="#8B4513" shadow="cast: true">
            </a-box>
            <a-cylinder radius="0.03" height="0.3" position="-0.2 0.15 -0.2" color="#654321" shadow="cast: true">
            </a-cylinder>
            <a-cylinder radius="0.03" height="0.3" position="0.2 0.15 -0.2" color="#654321" shadow="cast: true">
            </a-cylinder>
            <a-cylinder radius="0.03" height="0.3" position="-0.2 0.15 0.2" color="#654321" shadow="cast: true">
            </a-cylinder>
            <a-cylinder radius="0.03" height="0.3" position="0.2 0.15 0.2" color="#654321" shadow="cast: true">
            </a-cylinder>
        </a-entity>

        <a-entity position="-5 0 -6">
            <a-cylinder radius="0.3" height="0.5" color="#8B4513" shadow="cast: true">
            </a-cylinder>
            <a-cone radius-bottom="0.4" radius-top="0.1" height="1.2" position="0 0.85 0" color="#228B22"
                shadow="cast: true">
            </a-cone>
        </a-entity>

        <a-entity position="5 0 -6">
            <a-cylinder radius="0.3" height="0.5" color="#8B4513" shadow="cast: true">
            </a-cylinder>
            <a-cone radius-bottom="0.4" radius-top="0.1" height="1.2" position="0 0.85 0" color="#228B22"
                shadow="cast: true">
            </a-cone>
        </a-entity>

        <a-box position="-5.95 1.5 -4" width="0.2" height="3" depth="2" color="#654321" material="roughness: 0.6"
            shadow="cast: true; receive: true">
        </a-box>

        <a-box position="5.95 1.5 -4" width="0.2" height="3" depth="2" color="#654321" material="roughness: 0.6"
            shadow="cast: true; receive: true">
        </a-box>

        <a-entity position="-4 0 -6">
            <a-cylinder radius="0.2" height="0.05" color="#654321" shadow="cast: true">
            </a-cylinder>
            <a-cylinder radius="0.03" height="1.8" position="0 0.9 0" color="#654321" shadow="cast: true">
            </a-cylinder>
            <a-cone radius-bottom="0.3" radius-top="0.15" height="0.4" position="0 1.9 0" color="#F5DEB3"
                material="emissive: #FFD700; emissiveIntensity: 0.6" shadow="cast: true">
            </a-cone>
        </a-entity>

        <a-entity position="4 0 -6">
            <a-cylinder radius="0.2" height="0.05" color="#654321" shadow="cast: true">
            </a-cylinder>
            <a-cylinder radius="0.03" height="1.8" position="0 0.9 0" color="#654321" shadow="cast: true">
            </a-cylinder>
            <a-cone radius-bottom="0.3" radius-top="0.15" height="0.4" position="0 1.9 0" color="#F5DEB3"
                material="emissive: #FFD700; emissiveIntensity: 0.6" shadow="cast: true">
            </a-cone>
        </a-entity>

        <a-entity light="type: ambient; color: #FFF; intensity: 0.4"></a-entity>

        <a-entity light="type: point; color: #FFF8DC; intensity: 1.2; castShadow: true; shadowCameraVisible: false"
            position="-3 4.3 -4">
        </a-entity>

        <a-entity light="type: point; color: #FFF8DC; intensity: 1.2; castShadow: true; shadowCameraVisible: false"
            position="3 4.3 -4">
        </a-entity>

        <a-entity light="type: directional; color: #FFF; intensity: 0.5; castShadow: true" position="2 5 2">
        </a-entity>

        <a-entity id="rig" movement-controls="speed: 0.2; controls: checkpoint, gamepad, trackpad, keyboard, touch">
           <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: true">
    <a-entity cursor="fuse: true; rayOrigin: mouse;" position="0 0 -1"
        geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
        material="color: #FFD700; opacity: 0.9; side: double"
        raycaster="objects: .clickable; far: 20"> </a-entity>
</a-entity>

            <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 5"></a-entity>
            <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable; far: 5"></a-entity>
        </a-entity>

        </a-scene>
</body>

</html>
