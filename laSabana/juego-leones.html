<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Juego Avanzado VR: Clasificación de Dieta - V2</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      /* Estilos básicos para la página fuera de VR */
      html, body { height: 100%; margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
      body { background-color: #333; }
      /* La UI principal ahora está dentro de la escena, pero mantenemos el mensaje final */
      #game-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(0, 0, 0, 0.9);
        color: white;
        padding: 30px;
        border-radius: 15px;
        font-size: 2.5em;
        text-align: center;
        z-index: 1000;
        display: none;
      }
    </style>
  </head>
  <body>

    <div id="game-message">
      ¡JUEGO TERMINADO! 🎉
      <p>Puntuación Final: <span id="final-score">0</span></p>
      <button onclick="window.location.reload()" style="padding: 10px 20px; font-size: 1em; background-color: #00bcd4; color: white; border: none; border-radius: 5px; cursor: pointer;">Jugar de Nuevo</button>
      <button onclick="window.location.href='../'" style="padding: 10px 20px; font-size: 1em; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">Volver al Zoo</button>
    </div>

    <a-scene renderer="alpha: true">
      <a-assets>
        <a-asset-item id="lion-senior-model" src="./lionsenior/scene.gltf"></a-asset-item>
        <a-asset-item id="elephant-model" src="./elefante_asiatico/scene.gltf"></a-asset-item>
        
        <audio id="sfx-correct" src="./correct.mp3" preload="auto"></audio>
        <audio id="sfx-wrong" src="./wrong.mp3" preload="auto"></audio>
      </a-assets>

      <a-entity id="cameraRig" camera look-controls wasd-controls position="0 1.6 0" 
                raycaster="objects: .option-button; far: 10"
                cursor="rayOrigin: mouse; fuse: false">
          
          <a-entity cursor
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                    material="color: white; shader: flat"
                    rayOrigin="mouse">
          </a-entity>

          <a-plane id="hud-panel" position="1.2 0.3 -2" width="1.5" height="0.6" color="#34495e" rotation="0 -10 0">
            <a-text value="Puntuación: 0" id="hud-score" align="left" position="-0.7 0.2 0.01" width="3" color="#f1c40f"></a-text>
            <a-text value="Ronda: 1/5" id="hud-round" align="left" position="-0.7 0 0.01" width="3" color="#bdc3c7"></a-text>
            <a-text value="Tiempo: 10s" id="hud-timer" align="left" position="-0.7 -0.2 0.01" width="3" color="#e74c3c"></a-text>
          </a-plane>

      </a-entity>

      <a-plane id="info-panel" position="0 2 -3" width="3.5" height="1.8" color="#ecf0f1" rotation="0 0 0" material="side: double; opacity: 0.9">
        <a-text id="animal-name" value="Cargando..." align="center" position="0 0.6 0.01" width="6" color="#2c3e50" font="mozillavr" font-weight="bold"></a-text>
        
        <a-entity id="btn-herbivoro" class="option-button" data-dieta="herbivoro" position="-0.8 -0.1 0.01" 
                  animation__scalein="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
                  animation__scaleout="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
            <a-plane color="#27ae60" width="1.5" height="0.8"></a-plane>
            <a-text value="HERBÍVORO" align="center" position="0 0 0.02" width="3" color="#ffffff" font="mozillavr"></a-text>
        </a-entity>

        <a-entity id="btn-carnivoro" class="option-button" data-dieta="carnivoro" position="0.8 -0.1 0.01"
                  animation__scalein="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
                  animation__scaleout="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
            <a-plane color="#c0392b" width="1.5" height="0.8"></a-plane>
            <a-text value="CARNÍVORO" align="center" position="0 0 0.02" width="3" color="#ffffff" font="mozillavr"></a-text>
        </a-entity>

        <a-box id="time-bar" color="#f39c12" position="-1.65 0.85 0.01" width="3.3" height="0.1" depth="0.01" anchor="left" visible="false"></a-box>
      </a-plane>

      <a-text id="feedback-indicator" value="" align="center" position="0 3.5 -3" width="10" color="white" font="mozillavr" font-weight="bold" visible="false"></a-text>

      <a-entity id="animal-container" position="0 0 -5" rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear;">
        </a-entity>

      <a-plane position="0 0 -4" rotation="-90 0 0" width="100" height="100" color="#558B2F" shadow></a-plane>
      <a-sky color="#87CEEB"></a-sky> 
      <a-entity light="type: ambient; color: #BBB; intensity: 0.5"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 0.8; castShadow: true" position="-5 10 5"></a-entity>

    </a-scene>

    <script>
      // ===================================================================
      // 1. COMPONENTE PERSONALIZADO: Lógica del Juego (quiz-game)
      // ===================================================================

      AFRAME.registerComponent('quiz-game', {
        schema: {
          totalRounds: { type: 'int', default: 5 },
          timePerRound: { type: 'int', default: 10 }
        },
        init: function () {
          // Estado del juego
          this.score = 0;
          this.round = 0;
          // Agregamos más animales para mayor complejidad
          this.animals = [
            { name: "LEÓN", model: "#lion-senior-model", scale: "0.1 0.1 0.1", correctDieta: "carnivoro" },
            { name: "ELEFANTE ASIÁTICO", model: "#elephant-model", scale: "1 1 1", correctDieta: "herbivoro" },
            // Puedes añadir más modelos aquí para variar
          ];
          this.currentAnimal = null;
          this.timerInterval = null;
          this.timeLeft = this.data.timePerRound;

          // Elementos del DOM y A-Frame
          this.hudScoreEl = document.getElementById('hud-score');
          this.hudRoundEl = document.getElementById('hud-round');
          this.hudTimerEl = document.getElementById('hud-timer');
          this.nameEl = document.getElementById('animal-name');
          this.containerEl = document.getElementById('animal-container');
          this.timeBarEl = document.getElementById('time-bar');
          this.messageEl = document.getElementById('game-message');
          this.feedbackEl = document.getElementById('feedback-indicator');
          this.infoPanelEl = document.getElementById('info-panel');

          // Inicializar la UI
          this.updateHUD();

          // Escuchar clics en los botones de opción (usando delegación para el raycaster)
          document.querySelectorAll('.option-button').forEach(button => {
            button.addEventListener('click', this.checkAnswer.bind(this));
          });
          
          this.startGame();
        },

        updateHUD: function() {
            this.hudScoreEl.setAttribute('value', `Puntuación: ${this.score}`);
            this.hudRoundEl.setAttribute('value', `Ronda: ${this.round}/${this.data.totalRounds}`);
            this.hudTimerEl.setAttribute('value', `Tiempo: ${this.timeLeft}s`);
        },

        startGame: function() {
          this.nextRound();
        },

        nextRound: function() {
          if (this.round >= this.data.totalRounds) {
            this.endGame();
            return;
          }

          this.round++;
          
          // Elegir animal aleatorio
          const randomIndex = Math.floor(Math.random() * this.animals.length);
          this.currentAnimal = this.animals[randomIndex];

          // 1. Limpiar contenedor anterior y cargar nuevo modelo
          while (this.containerEl.firstChild) {
              this.containerEl.removeChild(this.containerEl.firstChild);
          }
          const model = document.createElement('a-gltf-model');
          model.setAttribute('src', this.currentAnimal.model);
          model.setAttribute('scale', this.currentAnimal.scale);
          model.setAttribute('shadow', '');
          this.containerEl.appendChild(model);

          // 2. Actualizar panel de información y HUD
          this.nameEl.setAttribute('value', this.currentAnimal.name);
          this.updateHUD();
          
          // 3. Reiniciar y comenzar temporizador
          this.timeLeft = this.data.timePerRound;
          this.timeBarEl.setAttribute('visible', 'true');
          this.startTimer();
        },

        startTimer: function() {
          if (this.timerInterval) clearInterval(this.timerInterval);
          
          const maxTime = this.data.timePerRound;
          const initialWidth = 3.3; // Ancho inicial de la barra
          
          this.timerInterval = setInterval(() => {
            this.timeLeft--;
            
            // Actualizar barra de tiempo visual
            const newWidth = (this.timeLeft / maxTime) * initialWidth;
            const newPositionX = -1.65 + (initialWidth - newWidth) / 2; // Asegura que se colapsa hacia el centro

            this.timeBarEl.setAttribute('width', newWidth > 0 ? newWidth : 0.01);
            this.timeBarEl.setAttribute('position', { x: newPositionX, y: 0.85, z: 0.01 });
            this.updateHUD();

            if (this.timeLeft <= 0) {
              clearInterval(this.timerInterval);
              this.handleTimeout();
            }
          }, 1000);
        },

        checkAnswer: function(event) {
          if (this.timeLeft <= 0) return;

          clearInterval(this.timerInterval);
          const selectedDieta = event.currentTarget.dataset.dieta;
          
          if (selectedDieta === this.currentAnimal.correctDieta) {
            this.updateScore(10, true);
          } else {
            this.updateScore(-5, false);
          }

          setTimeout(() => this.nextRound(), 1500);
        },

        handleTimeout: function() {
          this.updateScore(-5, false); // Puntos negativos por tiempo agotado
          this.showFeedback('❌ ¡TIEMPO AGOTADO!', '#e74c3c'); // Feedback visual

          setTimeout(() => this.nextRound(), 1500);
        },

        showFeedback: function(text, color) {
            this.feedbackEl.setAttribute('value', text);
            this.feedbackEl.setAttribute('color', color);
            this.feedbackEl.setAttribute('visible', 'true');
            
            // Animación de desvanecimiento para el feedback
            this.feedbackEl.setAttribute('animation', {
                property: 'position',
                to: '0 4.5 -3',
                dur: 1500,
                easing: 'easeOutQuad'
            });

            // Ocultar el feedback después de la animación
            setTimeout(() => {
                this.feedbackEl.setAttribute('visible', 'false');
                this.feedbackEl.setAttribute('position', '0 3.5 -3'); // Resetear posición
                this.feedbackEl.removeAttribute('animation');
            }, 1500);
        },

        updateScore: function(points, isCorrect) {
          this.score += points;
          this.updateHUD();

          // Feedback visual
          const color = isCorrect ? '#2ecc71' : '#e74c3c';
          const text = isCorrect ? '✅ ¡CORRECTO! +10' : '❌ ¡INCORRECTO! -5';
          this.showFeedback(text, color);

          // Feedback sonoro (si existen los archivos)
          const soundId = isCorrect ? '#sfx-correct' : '#sfx-wrong';
          const soundEl = document.querySelector(soundId);
          if (soundEl && soundEl.components.sound) {
            soundEl.components.sound.playSound();
          } else if (soundEl) {
            // Si no tiene el componente, lo añadimos temporalmente para usarlo
            soundEl.setAttribute('sound', 'src', soundId);
            soundEl.components.sound.playSound();
          }
        },

        endGame: function() {
          if (this.timerInterval) clearInterval(this.timerInterval);
          
          document.getElementById('final-score').textContent = this.score;
          this.messageEl.style.display = 'block';
        }
      });

      // ===================================================================
      // 2. INICIAR EL JUEGO
      // ===================================================================
      document.querySelector('a-scene').setAttribute('quiz-game', '');
    </script>
  </body>
</html>
